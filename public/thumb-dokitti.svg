<svg viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dbg" x1="200" y1="0" x2="200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5B04"/>
      <stop offset="100%" stop-color="#16232A"/>
    </linearGradient>
    <filter id="sb" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.62" numOctaves="1" seed="13" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g">
        <feFuncR type="linear" slope="3.2" intercept="-1.1"/>
        <feFuncG type="linear" slope="3.2" intercept="-1.1"/>
        <feFuncB type="linear" slope="3.2" intercept="-1.1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="400" height="600" fill="url(#dbg)"/>
  <!-- Stacked offset card-like glows -->
  <rect x="60" y="130" width="280" height="340" rx="40" fill="#16232A" filter="url(#sb)" opacity="0.70" transform="rotate(9 200 300)"/>
  <rect x="60" y="130" width="280" height="340" rx="40" fill="#E4EEF0" filter="url(#sb)" opacity="0.14" transform="rotate(-6 200 300)"/>
  <circle cx="280" cy="430" r="60" fill="#E4EEF0" filter="url(#sb)" opacity="0.30"/>
  <rect width="400" height="600" filter="url(#grain)" style="mix-blend-mode:overlay; opacity:0.60"/>
  <rect width="400" height="600" filter="url(#grain)" style="mix-blend-mode:screen;  opacity:0.22"/>
</svg>
