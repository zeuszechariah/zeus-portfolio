<svg viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sb" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.62" numOctaves="1" seed="17" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g">
        <feFuncR type="linear" slope="3.2" intercept="-1.1"/>
        <feFuncG type="linear" slope="3.2" intercept="-1.1"/>
        <feFuncB type="linear" slope="3.2" intercept="-1.1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="400" height="600" fill="#E4EEF0"/>
  <!-- Coffee ring glows — overlapping, soft -->
  <circle cx="155" cy="295" r="155" fill="#16232A" filter="url(#sb)" opacity="0.30"/>
  <circle cx="265" cy="320" r="125" fill="#075056" filter="url(#sb)" opacity="0.28"/>
  <circle cx="200" cy="265" r="70"  fill="#FF5B04" filter="url(#sb)" opacity="0.50"/>
  <rect width="400" height="600" filter="url(#grain)" style="mix-blend-mode:multiply; opacity:0.58"/>
  <rect width="400" height="600" filter="url(#grain)" style="mix-blend-mode:overlay;  opacity:0.28"/>
</svg>
